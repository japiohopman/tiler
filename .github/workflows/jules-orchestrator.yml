name: Jules Queue Orchestrator

# The heartbeat. Runs every 15 minutes, or manually via workflow_dispatch.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: jules-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate orchestrator configuration
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${JULES_API_KEY:-}" || {
            echo "JULES_API_KEY is not configured in GitHub Actions repository secrets."
            exit 1
          }
          test -f ROADMAP.md
          test -f AGEND.md
          test -f AGENT.MD
          test -f AGENT_RULES.md
          test -f docs/TASKBOARD.md
          test -f docs/errors.md
          test -f scripts/jules-orchestrator.mjs
          test -f .github/jules-queue-state.json
          node --check scripts/jules-orchestrator.mjs
          grep -q '^### Ready$' ROADMAP.md
          echo "Orchestrator configuration validated."

      - name: Run orchestrator
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JULES_SOURCE: sources/github/japiohopman/tiler
        run: node scripts/jules-orchestrator.mjs
